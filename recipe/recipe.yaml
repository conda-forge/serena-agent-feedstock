schema_version: 1

context:
  version: "2.1.0"
  python_min: "3.11"

package:
  name: serena-agent
  version: ${{ version }}

source:
  url: https://github.com/oraios/serena/archive/v${{ version }}.tar.gz
  sha256: 44a10afe8f27f5c987daec3b8e50835b7de129ce11073243a69ced76eeb45eda
  patches:
    - relax-deps.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - serena = serena.cli:top_level
      - serena-agent = serena.cli:top_level
      - serena-hooks = serena.hooks:hook_commands
requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.33.0
    - overrides >=7.7.0
    - python-dotenv >=1.2.2
    - mcp ==2.2.0
    - click >=8.3.1
    - flask >=3.1.3
    - sensai-utils >=1.5.0
    - pydantic >=2.12.5
    - types-pyyaml >=6.0.12.20250516
    - pyyaml >=6.0.2
    - ruamel.yaml >=0.18.14
    - jinja2 >=3.1.6
    - pathspec >=0.12.1
    - psutil >=7.0.0
    - docstring_parser >=0.17.0
    - joblib >=1.5.1
    - tqdm >=4.67.1
    - tiktoken >=0.12.0
    - anthropic >=0.117.0
    - beautifulsoup4 >=4.14.2
    - pystray >=0.19.5
    - pygls >=2.1.1
    - lsprotocol >=2025.0.0
    - oslex >=2.0.0
    - filelock >=3.25.2


tests:
  - python:
      imports:
        - serena
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - serena --help
      - serena-hooks --help

about:
  license: GPL-3.0-or-later AND MIT
  license_file:
    - LICENSE
    - LICENSES/
  homepage: https://github.com/oraios/serena
  summary: Serena is a powerful coding agent toolkit capable of turning an LLM into a fully-featured agent that works directly on your codebase. Unlike most other tools, it is not tied to an LLM, framework or an interface, making it easy to use it in a variety of ways.

extra:
  recipe-maintainers:
    - swenger
